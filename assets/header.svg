<svg xmlns="http://www.w3.org/2000/svg" width="860" height="200" viewBox="0 0 860 200" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="860" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0" y1="0" x2="860" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.6" />
    </linearGradient>
    <radialGradient id="corner-glow" cx="800" cy="40" r="250" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Segoe UI Mono', monospace; }
    .title-bar { fill: #161b22; }
    .term-title { fill: #8b949e; font-size: 12px; font-weight: 500; }
    .cmd-prompt { fill: #38bdf8; font-size: 13px; font-weight: 600; }
    .cmd-text { fill: #f0f6fc; font-size: 13px; font-weight: 500; }
    .label { fill: #7d8590; font-size: 12.5px; }
    .value { fill: #e6edf3; font-size: 12.5px; }
    .accent-cyan { fill: #38bdf8; }
    .accent-green { fill: #3fb950; }
    .accent-purple { fill: #bc8cff; }
    .cursor { fill: #38bdf8; animation: blink 1s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  </style>

  <!-- Background Card with 1px Border -->
  <rect x="1" y="1" width="858" height="198" rx="10" fill="url(#bg-grad)" stroke="#30363d" stroke-width="1.5" />
  <rect x="1" y="1" width="858" height="198" rx="10" fill="url(#corner-glow)" />

  <!-- Top Gradient Accent Line -->
  <path d="M 1 10 C 1 5, 5 1, 10 1 L 850 1 C 855 1, 859 5, 859 10 L 859 3 L 1 3 Z" fill="url(#glow-grad)" />

  <!-- Window Bar -->
  <rect x="1" y="3" width="858" height="32" rx="0" fill="#161b22" />
  <line x1="1" y1="35" x2="859" y2="35" stroke="#30363d" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="20" cy="19" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
  <circle cx="38" cy="19" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5" />
  <circle cx="56" cy="19" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />

  <!-- Window Title -->
  <text x="430" y="23" text-anchor="middle" class="mono term-title">chiraitori@station: ~ (sh)</text>

  <!-- Terminal Body -->
  <!-- Line 1: Command -->
  <text x="24" y="62" class="mono cmd-prompt">guest@chiraitori:~$</text>
  <text x="195" y="62" class="mono cmd-text">fetch-profile --format=compact</text>

  <!-- Line 2: Identity -->
  <text x="24" y="88" class="mono label">name</text>
  <text x="110" y="88" class="mono label">:</text>
  <text x="130" y="88" class="mono value">Chiraitori</text>
  <text x="235" y="88" class="mono label">(Ho Chi Minh City, VN 🇻🇳)</text>

  <!-- Line 3: Focus Areas -->
  <text x="24" y="112" class="mono label">focus</text>
  <text x="110" y="112" class="mono label">:</text>
  <text x="130" y="112" class="mono value"><tspan class="accent-cyan">Embedded &amp; IoT</tspan> · <tspan class="accent-green">Android Native (Compose)</tspan> · <tspan class="accent-purple">Local AI / MCP</tspan></text>

  <!-- Line 4: Primary Stack -->
  <text x="24" y="136" class="mono label">stack</text>
  <text x="110" y="136" class="mono label">:</text>
  <text x="130" y="136" class="mono value">Go · Kotlin · C/C++ · TypeScript · C# · Svelte · SQLite · MSSQL</text>

  <!-- Line 5: Current Mission -->
  <text x="24" y="160" class="mono label">mission</text>
  <text x="110" y="160" class="mono label">:</text>
  <text x="130" y="160" class="mono value">Building high-fluidity mobile tooling &amp; hardware bridges</text>

  <!-- Line 6: Prompt & blinking cursor -->
  <text x="24" y="184" class="mono cmd-prompt">guest@chiraitori:~$</text>
  <rect x="195" y="172" width="8" height="14" class="cursor" />

  <!-- Right Decorative ASCII / Mini badge -->
  <g opacity="0.85" transform="translate(680, 52)">
    <rect x="0" y="0" width="155" height="126" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
    <text x="77" y="24" text-anchor="middle" class="mono label" font-size="11px">SYSTEM TELEMETRY</text>
    <line x1="12" y1="34" x2="143" y2="34" stroke="#21262d" stroke-width="1" />
    
    <text x="18" y="54" class="mono label" font-size="11px">Uptime</text>
    <text x="138" y="54" text-anchor="end" class="mono accent-green" font-size="11px">99.98%</text>

    <text x="18" y="74" class="mono label" font-size="11px">Engine</text>
    <text x="138" y="74" text-anchor="end" class="mono accent-cyan" font-size="11px">Native/MCP</text>

    <text x="18" y="94" class="mono label" font-size="11px">License</text>
    <text x="138" y="94" text-anchor="end" class="mono value" font-size="11px">GPL-3 / MIT</text>

    <text x="18" y="114" class="mono label" font-size="11px">Mode</text>
    <text x="138" y="114" text-anchor="end" class="mono accent-purple" font-size="11px">Offline-1st</text>
  </g>
</svg>
