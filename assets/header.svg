<svg xmlns="http://www.w3.org/2000/svg" width="860" height="210" viewBox="0 0 860 210" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="860" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0" y1="0" x2="860" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.5" />
      <stop offset="80%" stop-color="#34d399" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.4" />
    </linearGradient>
    <radialGradient id="corner-glow" cx="820" cy="40" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Segoe UI Mono', monospace; }
    .term-title { fill: #8b949e; font-size: 12px; font-weight: 500; }
    .cmd-prompt { fill: #38bdf8; font-size: 13px; font-weight: 600; }
    .cmd-text { fill: #f0f6fc; font-size: 13px; font-weight: 500; }
    .label { fill: #7d8590; font-size: 12.5px; }
    .value { fill: #e6edf3; font-size: 12.5px; }
    .accent-cyan { fill: #38bdf8; font-weight: 500; }
    .accent-green { fill: #3fb950; font-weight: 500; }
    .accent-yellow { fill: #e3b341; font-weight: 500; }
    .accent-purple { fill: #bc8cff; font-weight: 500; }
    .cursor { fill: #38bdf8; animation: blink 1s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  </style>

  <!-- Background Card with 1.5px Border -->
  <rect x="1" y="1" width="858" height="208" rx="10" fill="url(#bg-grad)" stroke="#30363d" stroke-width="1.5" />
  <rect x="1" y="1" width="858" height="208" rx="10" fill="url(#corner-glow)" />

  <!-- Top Accent Bar -->
  <path d="M 1 10 C 1 5, 5 1, 10 1 L 850 1 C 855 1, 859 5, 859 10 L 859 3 L 1 3 Z" fill="url(#glow-grad)" />

  <!-- Window Header Bar -->
  <rect x="1" y="3" width="858" height="32" rx="0" fill="#161b22" />
  <line x1="1" y1="35" x2="859" y2="35" stroke="#30363d" stroke-width="1" />

  <!-- Window Buttons -->
  <circle cx="20" cy="19" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
  <circle cx="38" cy="19" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5" />
  <circle cx="56" cy="19" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />

  <!-- Window Title -->
  <text x="430" y="23" text-anchor="middle" class="mono term-title">chiraitori@station: ~ (sh)</text>

  <!-- Terminal Body -->
  <!-- Line 1: Command -->
  <text x="28" y="64" class="mono cmd-prompt">chiraitori@station:~$</text>
  <text x="215" y="64" class="mono cmd-text">neofetch --profile</text>

  <!-- Line 2: Identity -->
  <text x="28" y="90" class="mono label">host</text>
  <text x="115" y="90" class="mono label">:</text>
  <text x="135" y="90" class="mono value">chiraitori <tspan class="label">@ Ho Chi Minh City, VN 🇻🇳</tspan></text>

  <!-- Line 3: Focus Areas -->
  <text x="28" y="114" class="mono label">focus</text>
  <text x="115" y="114" class="mono label">:</text>
  <text x="135" y="114" class="mono value"><tspan class="accent-cyan">Embedded &amp; IoT</tspan> · <tspan class="accent-green">Android Native</tspan> · <tspan class="accent-yellow">Linux VPS &amp; Network Security</tspan></text>

  <!-- Line 4: Primary Stack -->
  <text x="28" y="138" class="mono label">stack</text>
  <text x="115" y="138" class="mono label">:</text>
  <text x="135" y="138" class="mono value">Go · Kotlin (Compose) · C/C++ · TypeScript · C# · Svelte · SQLite · MSSQL</text>

  <!-- Line 5: Security & Infra -->
  <text x="28" y="162" class="mono label">security</text>
  <text x="115" y="162" class="mono label">:</text>
  <text x="135" y="162" class="mono value"><tspan class="accent-purple">Server Hardening</tspan> · Packet Filtering (Anis) · DNS Sinkholes · WireGuard · Docker</text>

  <!-- Line 6: Prompt & cursor -->
  <text x="28" y="188" class="mono cmd-prompt">chiraitori@station:~$</text>
  <rect x="215" y="176" width="8" height="15" class="cursor" />
</svg>
